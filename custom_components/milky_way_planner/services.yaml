best_night:
  fields:
    days:
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box
    count:
      default: 3
      selector:
        number:
          min: 1
          max: 50
          mode: box
    min_grade:
      default: best
      selector:
        select:
          translation_key: min_grade
          options:
            - best
            - short
    min_score:
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box
    sort:
      default: score
      selector:
        select:
          translation_key: sort
          options:
            - score
            - date
            - window
    site:
      selector:
        entity:
          domain: weather
          integration: astroweather
    start:
      selector:
        date:
    include_sites:
      default: true
      selector:
        boolean:
