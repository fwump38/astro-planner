best_night:
  fields:
    days:
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box
    count:
      default: 3
      selector:
        number:
          min: 1
          max: 50
          mode: box
    min_grade:
      default: best
      selector:
        select:
          translation_key: min_grade
          options:
            - best
            - short
            - any
    min_score:
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box
    sort:
      default: score
      selector:
        select:
          translation_key: sort
          options:
            - score
            - date
            - window
    site:
      selector:
        entity:
          domain: weather
          integration: astroweather
    start:
      selector:
        date:
    include_sites:
      default: true
      selector:
        boolean:

visible_targets:
  fields:
    days:
      default: 1
      selector:
        number:
          min: 1
          max: 14
          mode: box
    start:
      selector:
        date:
    kinds:
      selector:
        select:
          multiple: true
          translation_key: target_kind
          options:
            - galaxy
            - globular_cluster
            - open_cluster
            - planetary_nebula
            - nebula
            - supernova_remnant
            - star_cloud
            - double_star
            - asterism
            - planet
            - custom
    min_minutes:
      default: 60
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
          mode: box
